networks:
  app:
    driver: bridge
    internal: false

volumes:
  # RAM only: the audit file holds request and response bodies. It never touches the host disk and is gone when
  # the last container that mounts it stops.
  # ponytail: loguru keeps rotated zips here without retention; the size cap stops the writes, a restart clears the volume.
  audit-log:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=512m"

services:
  openwebui:
    environment:
      ENABLE_AUDIT_LOGS_FILE: "true"
      AUDIT_LOGS_FILE_PATH: /app/backend/data/audit/audit.log
      AUDIT_LOG_LEVEL: REQUEST_RESPONSE
      AUDIT_EXCLUDED_PATHS: ${AUDIT_EXCLUDED_PATHS:-/_app}
      ENABLE_AUDIT_GET_REQUESTS: ${AUDIT_ENABLE_GET_REQUESTS:-true}
    volumes:
      - audit-log:/app/backend/data/audit

  # Named audit-alloy (not alloy): base compose defaults OTEL_EXPORTER_OTLP_ENDPOINT to alloy:4317
  # and this sidecar exposes no OTLP receiver.
  audit-alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    networks:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - openwebui
    # grafana/alloy runs as uid 473; the bind-mounted .docker/data/alloy and the tmpfs audit volume are root-owned.
    # Run as root so bbolt checkpoint + audit.ocsf.json writes and audit.log reads work.
    user: "0"
    # public-preview: otelcol.receiver.filelog + otelcol.storage.file are public-preview components.
    command: ["run", "--stability.level=public-preview", "--storage.path=/var/lib/alloy/data", "--server.http.listen-addr=127.0.0.1:12345", "/etc/alloy/ocsf.alloy"]
    environment:
      AUDIT_OCSF_SINK: ${AUDIT_OCSF_SINK:-file}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-false}
      OTEL_BASIC_AUTH_USERNAME: ${OTEL_BASIC_AUTH_USERNAME:-}
      OTEL_BASIC_AUTH_PASSWORD: ${OTEL_BASIC_AUTH_PASSWORD:-}
    volumes:
      - .docker/alloy:/etc/alloy:ro
      - audit-log:/var/log/openwebui:ro
      - .docker/data/alloy:/var/lib/alloy/data
